<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kontrol B – Mes chantiers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8B7CFF}a:hover{color:#A99EFF}
.k{--bg:#EEF1F6;--surface:#FFFFFF;--surface2:#F3F5F9;--ink:#0B1220;--ink2:#4A5568;--line:#D5DBE5;--accent:#5B47E0;--on-accent:#FFFFFF;--r:#B91C1C;--r-bg:#FDE8E8;--o:#B45309;--o-bg:#FDF0E1;--b:#1D4ED8;--b-bg:#E3ECFD;--g:#15803D;--g-bg:#E1F5E8;--n:#4B5563;--n-bg:#ECEEF1;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.k.dark{--bg:#0B1220;--surface:#131C2E;--surface2:#1B263B;--ink:#EEF2F8;--ink2:#A3B0C4;--line:#26334A;--accent:#8B7CFF;--on-accent:#0B1220;--r:#FF8A8A;--r-bg:#3A1A22;--o:#FDBA74;--o-bg:#3A2716;--b:#8DB4FF;--b-bg:#172A4D;--g:#6EE7A0;--g-bg:#12331F;--n:#B4BCC8;--n-bg:#232C3A}
.mono{font-family:'IBM Plex Mono',monospace}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;font-size:16px;font-weight:600}
</style>
</helmet>
<div class="k {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding-top: 54px">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 0 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="36" height="36" viewBox="0 0 180 180" aria-hidden="true"><rect width="180" height="180" rx="44" fill="var(--surface2)"/><path d="M58 40V140" stroke="var(--ink)" stroke-width="22" stroke-linecap="round" fill="none"/><path d="M66 96L122 40" stroke="var(--ink)" stroke-width="22" stroke-linecap="round" fill="none"/><path d="M84 96L106 126L146 70" stroke="var(--accent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.3px">Kontrol</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--g-bg); color: var(--g); font-size: 16px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1 0 8z"/><path d="M9.5 13.5l2 2 3.5-3.5"/></svg>
      Drive 16:42
    </div>
  </header>

  <div style="padding: 20px 16px 0 16px">
    <div style="font-size: 16px; color: var(--ink2)">Samedi 7 novembre</div>
    <h1 style="margin: 2px 0 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Mes chantiers</h1>
  </div>

  <div style="margin: 16px 16px 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="background: var(--b-bg); border-radius: 14px; padding: 12px">
      <div class="mono" style="font-size: 30px; font-weight: 600; color: var(--b); line-height: 1">16</div>
      <div style="font-size: 16px; color: var(--ink); margin-top: 4px">ouvertes</div>
    </div>
    <div style="background: var(--r-bg); border-radius: 14px; padding: 12px">
      <div class="mono" style="font-size: 30px; font-weight: 600; color: var(--r); line-height: 1">3</div>
      <div style="font-size: 16px; color: var(--ink); margin-top: 4px">en retard</div>
    </div>
    <div style="background: var(--r-bg); border-radius: 14px; padding: 12px">
      <div class="mono" style="font-size: 30px; font-weight: 600; color: var(--r); line-height: 1">1</div>
      <div style="font-size: 16px; color: var(--ink); margin-top: 4px">bloquant</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 16px 0 16px">
    <sc-for list="{{chantiers}}" as="c" hint-placeholder-count="3">
      <a href="#" style="display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span class="mono" style="font-size: 16px; color: var(--ink2)">{{c.site}}</span>
          <span style="font-size: 16px; color: var(--ink2)">{{c.phase}}</span>
        </div>
        <div style="font-size: 19px; font-weight: 600; line-height: 1.25; margin-top: 6px">{{c.nom}}</div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 12px">
          <div style="flex: 1 1 auto; height: 8px; border-radius: 999px; background: var(--surface2); overflow: hidden">
            <div style="height: 8px; width: {{c.pct}}%; border-radius: 999px; background: var(--accent)"></div>
          </div>
          <span class="mono" style="font-size: 16px; font-weight: 600">{{c.pct}} %</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px">
          <span class="chip" style="background: var(--b-bg); color: var(--b)">{{c.ouv}} ouvertes</span>
          <span class="chip" style="background: {{c.retBg}}; color: {{c.retFg}}">{{c.ret}} en retard</span>
          <span class="chip" style="background: {{c.bloBg}}; color: {{c.bloFg}}">{{c.blo}} bloquant</span>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px 16px; background: var(--bg); border-top: 1px solid var(--line)">
    <button style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-family: inherit; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nouveau chantier
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tone = (n) => (n > 0 ? { bg: 'var(--r-bg)', fg: 'var(--r)' } : { bg: 'var(--n-bg)', fg: 'var(--n)' });
    const raw = [
      { nom: 'Réhabilitation bâtiment 12 – Camp Nord', site: 'CAMP NORD · B12', phase: 'Exécution', pct: 62, ouv: 8, ret: 2, blo: 1 },
      { nom: 'Réfection étanchéité toiture – Bât. 4', site: 'BASE SUD · B04', phase: 'Préparation', pct: 15, ouv: 3, ret: 0, blo: 0 },
      { nom: 'Mise en conformité SSI – Bât. 30', site: 'CAMP NORD · B30', phase: 'OPR', pct: 95, ouv: 5, ret: 1, blo: 0 }
    ];
    return {
      mode: this.props.sombre === false ? '' : 'dark',
      chantiers: raw.map((c) => {
        const r = tone(c.ret), b = tone(c.blo);
        return { ...c, retBg: r.bg, retFg: r.fg, bloBg: b.bg, bloFg: b.fg };
      })
    };
  }
}
</script>
</body>
</html>
