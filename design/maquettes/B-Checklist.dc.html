<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kontrol B – Checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8B7CFF}a:hover{color:#A99EFF}
.k{--bg:#EEF1F6;--surface:#FFFFFF;--surface2:#F3F5F9;--ink:#0B1220;--ink2:#4A5568;--line:#D5DBE5;--accent:#5B47E0;--on-accent:#FFFFFF;--r:#B91C1C;--r-bg:#FDE8E8;--o:#B45309;--o-bg:#FDF0E1;--b:#1D4ED8;--b-bg:#E3ECFD;--g:#15803D;--g-bg:#E1F5E8;--n:#4B5563;--n-bg:#ECEEF1;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.k.dark{--bg:#0B1220;--surface:#131C2E;--surface2:#1B263B;--ink:#EEF2F8;--ink2:#A3B0C4;--line:#26334A;--accent:#8B7CFF;--on-accent:#0B1220;--r:#FF8A8A;--r-bg:#3A1A22;--o:#FDBA74;--o-bg:#3A2716;--b:#8DB4FF;--b-bg:#172A4D;--g:#6EE7A0;--g-bg:#12331F;--n:#B4BCC8;--n-bg:#232C3A}
.mono{font-family:'IBM Plex Mono',monospace}
.tab{flex:1 1 auto;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;color:var(--ink2);font-size:16px;font-weight:600;padding:0 8px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.fchip{flex:0 0 auto;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 14px}
.st{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-r{background:var(--r-bg);color:var(--r)}.st-o{background:var(--o-bg);color:var(--o)}.st-b{background:var(--b-bg);color:var(--b)}.st-g{background:var(--g-bg);color:var(--g)}.st-n{background:var(--n-bg);color:var(--n)}
.pt{display:block;text-decoration:none;color:var(--ink);padding:12px 14px;border-top:1px solid var(--line)}
.pt.blo{background:var(--r-bg);box-shadow:inset 0 0 0 2px var(--r)}
</style>
</helmet>
<div class="k {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding-top: 54px">
  <header style="display: flex; align-items: center; gap: 4px; padding: 4px 16px 0 6px">
    <a href="B-Accueil.dc.html" aria-label="Retour à mes chantiers" style="width: 48px; height: 48px; color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="min-width: 0; flex: 1 1 auto">
      <div class="mono" style="font-size: 16px; color: var(--ink2)">CAMP NORD · B12 · 62 %</div>
      <div style="font-size: 20px; font-weight: 700; line-height: 1.2">Réhabilitation bâtiment 12</div>
    </div>
    <a href="B-Exports.dc.html" aria-label="Exports et sauvegarde" style="width: 48px; height: 48px; color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </a>
  </header>

  <nav aria-label="Sections du chantier" style="display: flex; gap: 2px; margin: 12px 16px 0 16px; padding: 4px; border-radius: 16px; background: var(--surface2)">
    <a href="#" class="tab on" aria-current="page">Checklist</a>
    <a href="B-Reserves.dc.html" class="tab">Réserves</a>
    <a href="B-Jalons.dc.html" class="tab">Jalons</a>
    <a href="#" class="tab">Intervenants</a>
  </nav>

  <div style="margin: 12px 16px 0 16px; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1 1 auto; height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; display: flex">
      <div style="width: 58%; background: var(--g)"></div>
      <div style="width: 7%; background: var(--r)"></div>
      <div style="width: 10%; background: var(--o)"></div>
    </div>
    <span class="mono" style="font-size: 16px; font-weight: 600">34/58</span>
  </div>
  <div style="margin: 4px 16px 0 16px; font-size: 16px; color: var(--ink2)">34 conformes · 4 non conformes dont 2 bloquants</div>

  <div style="display: flex; gap: 8px; padding: 12px 16px 0 16px; overflow: hidden">
    <button class="fchip" style="background: var(--accent); color: var(--on-accent); border-color: var(--accent)">Tous <span class="mono">58</span></button>
    <button class="fchip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--r)" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/></svg>Bloquants <span class="mono">2</span></button>
    <button class="fchip">À contrôler <span class="mono">18</span></button>
  </div>

  <div style="padding: 12px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{groupes}}" as="g" hint-placeholder-count="3">
      <section style="background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px 10px 14px">
          <div style="display: flex; align-items: baseline; gap: 8px">
            <span class="mono" style="font-size: 16px; font-weight: 600; color: var(--accent)">{{g.lot}}</span>
            <span style="font-size: 17px; font-weight: 700">{{g.phase}}</span>
          </div>
          <span class="mono" style="font-size: 16px; color: var(--ink2)">{{g.compte}}</span>
        </div>
        <sc-for list="{{g.points}}" as="p" hint-placeholder-count="2">
          <a href="B-Point.dc.html" class="pt {{p.bloCls}}">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
              <span class="mono" style="font-size: 16px; color: var(--ink2)">{{p.ref}}</span>
              <span class="st {{p.cls}}">{{p.etat}}</span>
            </div>
            <div style="font-size: 17px; font-weight: 600; line-height: 1.3; margin-top: 4px">{{p.titre}}</div>
            <sc-if value="{{p.blo}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 16px; font-weight: 700; color: var(--r)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/></svg>
                Point bloquant · {{p.bloTxt}}
              </div>
            </sc-if>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const E = {
      g: { etat: 'Conforme', cls: 'st-g' },
      r: { etat: 'Non conforme', cls: 'st-r' },
      o: { etat: 'À reprendre', cls: 'st-o' },
      b: { etat: 'À contrôler', cls: 'st-b' },
      n: { etat: 'Sans objet', cls: 'st-n' }
    };
    const pt = (ref, titre, st, bloTxt) => ({ ref, titre, ...E[st], blo: !!bloTxt, bloTxt: bloTxt || '', bloCls: bloTxt ? 'blo' : '' });
    return {
      mode: this.props.sombre === false ? '' : 'dark',
      groupes: [
        { lot: 'GO', phase: 'Exécution', compte: '14/22', points: [
          pt('CCTP §3.4.2', 'Relevés d’étanchéité d’acrotère ≥ 15 cm', 'r', 'avant pose couvertine'),
          pt('CCTP §3.2.1', 'Reprise des fissures de façade par injection', 'g')
        ] },
        { lot: 'CVC', phase: 'Exécution', compte: '9/19', points: [
          pt('CCTP §4.1.3', 'Calorifugeage des réseaux ECS en local technique', 'o'),
          pt('CCTP §4.2.1', 'Essai d’étanchéité du réseau de chauffage', 'b')
        ] },
        { lot: 'ELE', phase: 'Préparation', compte: '11/17', points: [
          pt('CCTP §5.1.1', 'Visa de la note de calcul TGBT', 'g')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
