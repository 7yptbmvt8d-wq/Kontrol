<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kontrol B – Point de contrôle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8B7CFF}a:hover{color:#A99EFF}
.k{--bg:#EEF1F6;--surface:#FFFFFF;--surface2:#F3F5F9;--ink:#0B1220;--ink2:#4A5568;--line:#D5DBE5;--accent:#5B47E0;--on-accent:#FFFFFF;--r:#B91C1C;--r-bg:#FDE8E8;--o:#B45309;--o-bg:#FDF0E1;--b:#1D4ED8;--b-bg:#E3ECFD;--g:#15803D;--g-bg:#E1F5E8;--n:#4B5563;--n-bg:#ECEEF1;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.k.dark{--bg:#0B1220;--surface:#131C2E;--surface2:#1B263B;--ink:#EEF2F8;--ink2:#A3B0C4;--line:#26334A;--accent:#8B7CFF;--on-accent:#0B1220;--r:#FF8A8A;--r-bg:#3A1A22;--o:#FDBA74;--o-bg:#3A2716;--b:#8DB4FF;--b-bg:#172A4D;--g:#6EE7A0;--g-bg:#12331F;--n:#B4BCC8;--n-bg:#232C3A}
.mono{font-family:'IBM Plex Mono',monospace}
.kv{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:16px;line-height:1.35}
.kv dt{flex:0 0 84px;color:var(--ink2)}
.kv dd{margin:0;flex:1 1 auto;font-weight:500}
.es{flex:1 1 0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-family:inherit;font-size:16px;font-weight:600;padding:0 4px}
</style>
</helmet>
<div class="k {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding-top: 54px">
  <header style="display: flex; align-items: center; gap: 4px; padding: 4px 16px 0 6px">
    <a href="B-Checklist.dc.html" aria-label="Retour à la checklist" style="width: 48px; height: 48px; color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="mono" style="font-size: 16px; color: var(--ink2)">GO · Exécution · point 7/22</div>
  </header>

  <div style="padding: 6px 16px 0 16px">
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--r-bg); color: var(--r); font-size: 16px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/></svg>Bloquant
      </span>
      <span class="mono" style="display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--surface2); font-size: 16px">CCTP §3.4.2</span>
    </div>
    <h1 style="margin: 10px 0 0 0; font-size: 24px; line-height: 1.25; font-weight: 700">Relevés d’étanchéité d’acrotère</h1>
  </div>

  <dl style="margin: 12px 16px 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden">
    <div class="kv" style="border-top: 0"><dt>Type</dt><dd>Contrôle visuel et mesure</dd></div>
    <div class="kv"><dt>Critère</dt><dd>Relevé ≥ 15 cm au-dessus de la protection, tête protégée par bande solin</dd></div>
    <div class="kv"><dt>Référentiel</dt><dd class="mono">NF DTU 43.1</dd></div>
    <div class="kv"><dt>Échéance</dt><dd><span class="mono" style="font-weight: 600">14/11/2026</span> · avant pose couvertine</dd></div>
  </dl>

  <div style="margin: 14px 16px 0 16px">
    <div style="font-size: 16px; color: var(--ink2); margin-bottom: 6px">État</div>
    <div style="display: flex; gap: 6px">
      <button class="es" style="color: var(--g)">Conforme</button>
      <button class="es" aria-pressed="true" style="background: var(--r-bg); border-color: var(--r); box-shadow: inset 0 0 0 1px var(--r); color: var(--r)">Non conf.</button>
      <button class="es" style="color: var(--o)">À revoir</button>
      <button class="es" style="flex: 0 0 56px; color: var(--n)">S.O.</button>
    </div>
  </div>

  <div style="margin: 14px 16px 0 16px">
    <label for="comPt" style="display: block; font-size: 16px; color: var(--ink2); margin-bottom: 6px">Commentaire</label>
    <textarea id="comPt" style="width: 100%; height: 72px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; padding: 10px 12px; resize: none">Relevé mesuré à 9 cm côté nord, angle NE.</textarea>
  </div>

  <div style="margin: 12px 16px 0 16px; display: flex; gap: 8px">
    <div role="img" aria-label="Photo 1" style="width: 72px; height: 72px; border-radius: 12px; background: var(--surface2); color: var(--ink2); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
    </div>
    <div role="img" aria-label="Photo 2" style="width: 72px; height: 72px; border-radius: 12px; background: var(--surface2); color: var(--ink2); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
    </div>
    <button aria-label="Ajouter une photo" style="width: 72px; height: 72px; border-radius: 12px; border: 2px dashed var(--accent); background: transparent; color: var(--accent); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px 16px; background: var(--bg); border-top: 1px solid var(--line)">
    <a href="B-Saisie.dc.html" style="height: 56px; border-radius: 16px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Créer une réserve
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.sombre === false ? '' : 'dark' };
  }
}
</script>
</body>
</html>
