<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kontrol B – Icône</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8B7CFF}a:hover{color:#A99EFF}
</style>
</helmet>
<div style="width: 560px; height: 420px; box-sizing: border-box; padding: 40px; background: #0B1220; font-family: 'IBM Plex Sans', sans-serif; color: #EEF2F8; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; align-items: flex-end; gap: 28px">
    <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 180 180" role="img" aria-label="Icône Kontrol {{s.px}} px">
          <rect width="180" height="180" rx="40" fill="#1B263B"/>
          <path d="M58 40V140" stroke="#EEF2F8" stroke-width="22" stroke-linecap="round" fill="none"/>
          <path d="M66 96L122 40" stroke="#EEF2F8" stroke-width="22" stroke-linecap="round" fill="none"/>
          <path d="M84 96L106 126L146 70" stroke="#8B7CFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span style="font-size: 16px; color: #A3B0C4">{{s.px}} px</span>
      </div>
    </sc-for>
  </div>
  <div>
    <div style="font-size: 24px; font-weight: 700">K-coche</div>
    <p style="margin: 6px 0 0 0; font-size: 16px; line-height: 1.4; color: #A3B0C4; max-width: 460px">La jambe du K devient une coche de validation : le nom et la fonction (contrôler, lever) dans un seul signe. Fond ardoise, coche violette.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return { sizes: [{ px: 180 }, { px: 120 }, { px: 60 }, { px: 29 }] };
  }
}
</script>
</body>
</html>
