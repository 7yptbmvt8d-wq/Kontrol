<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kontrol B – Détail réserve</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8B7CFF}a:hover{color:#A99EFF}
.k{--bg:#EEF1F6;--surface:#FFFFFF;--surface2:#F3F5F9;--ink:#0B1220;--ink2:#4A5568;--line:#D5DBE5;--accent:#5B47E0;--on-accent:#FFFFFF;--r:#B91C1C;--r-bg:#FDE8E8;--o:#B45309;--o-bg:#FDF0E1;--b:#1D4ED8;--b-bg:#E3ECFD;--g:#15803D;--g-bg:#E1F5E8;--on-g:#FFFFFF;--n:#4B5563;--n-bg:#ECEEF1;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.k.dark{--bg:#0B1220;--surface:#131C2E;--surface2:#1B263B;--ink:#EEF2F8;--ink2:#A3B0C4;--line:#26334A;--accent:#8B7CFF;--on-accent:#0B1220;--r:#FF8A8A;--r-bg:#3A1A22;--o:#FDBA74;--o-bg:#3A2716;--b:#8DB4FF;--b-bg:#172A4D;--g:#6EE7A0;--g-bg:#12331F;--on-g:#0B1220;--n:#B4BCC8;--n-bg:#232C3A}
.mono{font-family:'IBM Plex Mono',monospace}
.st{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ph{position:relative;height:130px;border-radius:16px;background:var(--surface2);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.phl{position:absolute;left:8px;top:8px;height:26px;padding:0 8px;border-radius:8px;display:flex;align-items:center;font-size:16px;font-weight:600}
.cell{padding:10px 12px}
.cell dt{font-size:16px;color:var(--ink2)}
.cell dd{margin:2px 0 0 0;font-size:16px;font-weight:600}
</style>
</helmet>
<div class="k {{mode}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding-top: 54px">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 0 6px">
    <a href="B-Reserves.dc.html" aria-label="Retour aux réserves" style="width: 48px; height: 48px; color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="st" style="background: var(--o-bg); color: var(--o)">Relancée</span>
  </header>

  <div style="padding: 4px 16px 0 16px">
    <div class="mono" style="font-size: 16px; color: var(--ink2)">R-06 · ELE · Volta Élec</div>
    <h1 style="margin: 4px 0 0 0; font-size: 22px; line-height: 1.25; font-weight: 700">BAES non fonctionnel, circulation R+1</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 16px 0 16px">
    <div class="ph" role="img" aria-label="Photo avant reprise">
      <span class="phl" style="background: var(--r-bg); color: var(--r)">Avant · 27/10</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
    </div>
    <div class="ph" role="img" aria-label="Photo après reprise">
      <span class="phl" style="background: var(--g-bg); color: var(--g)">Après · 07/11</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
    </div>
  </div>

  <dl style="margin: 10px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px">
    <div class="cell"><dt>Localisation</dt><dd>R+1 · circulation</dd></div>
    <div class="cell"><dt>Gravité</dt><dd>Majeure</dd></div>
    <div class="cell" style="border-top: 1px solid var(--line)"><dt>Échéance</dt><dd class="mono">10/11/2026</dd></div>
    <div class="cell" style="border-top: 1px solid var(--line)"><dt>Origine</dt><dd class="mono">CCTP §5.3.2</dd></div>
  </dl>

  <h2 style="margin: 16px 16px 4px 16px; font-size: 17px; font-weight: 700">Historique</h2>
  <ol style="list-style: none; margin: 0 16px; padding: 0">
    <sc-for list="{{histo}}" as="h" hint-placeholder-count="4">
      <li style="display: flex; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: center; flex: 0 0 14px">
          <span style="width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; background: {{h.col}}"></span>
          <span style="flex: 1 1 auto; width: 2px; background: var(--line)"></span>
        </div>
        <div style="padding-bottom: 10px">
          <div style="font-size: 16px; font-weight: 600">{{h.txt}}</div>
          <div class="mono" style="font-size: 16px; color: var(--ink2)">{{h.date}}</div>
        </div>
      </li>
    </sc-for>
  </ol>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px 16px; background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 8px">
    <button style="flex: 0 0 auto; height: 56px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: inherit; font-size: 17px; font-weight: 600">Refuser</button>
    <button style="flex: 1 1 auto; height: 56px; border: 0; border-radius: 16px; background: var(--g); color: var(--on-g); font-family: inherit; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      Lever la réserve
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sombre":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      mode: this.props.sombre === false ? '' : 'dark',
      histo: [
        { txt: 'Travaux signalés terminés par Volta Élec', date: '07/11 · 11:20', col: 'var(--g)' },
        { txt: 'Relance n°1 envoyée', date: '06/11 · 09:05', col: 'var(--o)' },
        { txt: 'Notifiée à l’entreprise (CR n°12)', date: '27/10 · 17:40', col: 'var(--b)' },
        { txt: 'Créée lors de la visite de chantier', date: '27/10 · 10:15', col: 'var(--b)' }
      ]
    };
  }
}
</script>
</body>
</html>
